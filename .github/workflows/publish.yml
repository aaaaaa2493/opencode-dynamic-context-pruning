name: Publish hierarchical package

on:
    workflow_dispatch:
    push:
        branches:
            - master

permissions:
    contents: write

concurrency:
    group: hierarchical-release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    release:
        name: Build, test and publish GitHub package
        if: github.ref == 'refs/heads/master'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "24.x"
                  cache: npm

            - name: Install dependencies
              run: npm ci --legacy-peer-deps

            - name: Type check
              run: npm run typecheck

            - name: Test
              run: npm test

            - name: Build and verify package
              run: npm run check:package

            - name: Pack installable distribution
              run: |
                  mkdir release
                  npm pack --ignore-scripts --pack-destination release
                  mv release/*.tgz release/opencode-dcp-hierarchical.tgz

            - name: Test packed entrypoints
              run: npm run test:package

            - name: Publish versioned GitHub package
              env:
                  GH_TOKEN: ${{ github.token }}
                  PACKAGE_DIR: ${{ runner.temp }}/dcp-package
                  GIT_AUTHOR_NAME: github-actions[bot]
                  GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
                  GIT_COMMITTER_NAME: github-actions[bot]
                  GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
              run: |
                  TAG="v$(node -p "require('./package.json').version")"
                  if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
                      exit 0
                  fi
                  git worktree add --detach "$PACKAGE_DIR"
                  git -C "$PACKAGE_DIR" switch --orphan release-build
                  tar -xzf release/opencode-dcp-hierarchical.tgz -C "$PACKAGE_DIR" --strip-components=1
                  node scripts/prepare-package.mjs "$PACKAGE_DIR"
                  git -C "$PACKAGE_DIR" add --all
                  git -C "$PACKAGE_DIR" commit -m "build: release $TAG from master ${GITHUB_SHA:0:7}"
                  git -C "$PACKAGE_DIR" tag -a "$TAG" -m "Hierarchical DCP $TAG"
                  git -C "$PACKAGE_DIR" push origin "refs/tags/$TAG"
                  gh release create "$TAG" release/opencode-dcp-hierarchical.tgz \
                      --title "Hierarchical DCP $TAG" \
                      --notes "Prebuilt hierarchical plugin from master commit ${GITHUB_SHA}. Install github:aaaaaa2493/opencode-dynamic-context-pruning#${TAG}." \
                      --latest
