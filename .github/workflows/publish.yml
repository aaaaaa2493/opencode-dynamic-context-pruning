name: Publish hierarchical package

on:
    workflow_dispatch:
    push:
        branches:
            - master

permissions:
    contents: write

concurrency:
    group: hierarchical-release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    release:
        name: Build, test and publish GitHub package
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "24.x"
                  cache: npm

            - name: Install dependencies
              run: npm ci --legacy-peer-deps

            - name: Type check
              run: npm run typecheck

            - name: Test
              run: npm test

            - name: Build and verify package
              run: npm run check:package

            - name: Pack installable distribution
              run: |
                  mkdir release
                  npm pack --ignore-scripts --pack-destination release
                  mv release/*.tgz release/opencode-dcp-hierarchical.tgz

            - name: Test packed entrypoints
              run: npm run test:package

            - name: Publish release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  TAG="hierarchical-${GITHUB_RUN_NUMBER}"
                  ASSET="release/opencode-dcp-hierarchical.tgz"
                  if gh release view "$TAG" >/dev/null 2>&1; then
                      gh release upload "$TAG" "$ASSET" --clobber
                  else
                      gh release create "$TAG" "$ASSET" \
                          --target "$GITHUB_SHA" \
                          --title "Hierarchical DCP (${GITHUB_SHA:0:7})" \
                          --notes "Prebuilt hierarchical plugin from master commit ${GITHUB_SHA}. See README.md for installation." \
                          --latest
                  fi
